<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>GPU Stress Test</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Orbitron',monospace;touch-action:manipulation;-webkit-user-select:none;user-select:none}
canvas{display:block}
#hud{position:fixed;top:0;left:0;width:100%;pointer-events:none;z-index:10;padding:16px 20px;
  background:linear-gradient(180deg,rgba(0,0,0,.7) 0%,transparent 100%)}
.hud-row{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.hud-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:8px 14px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.hud-card .label{font-size:9px;color:rgba(255,255,255,.4);letter-spacing:2px;text-transform:uppercase}
.hud-card .value{font-size:22px;font-weight:900;color:#fff;line-height:1.2}
#fps-card{border-color:rgba(0,255,136,.3);background:rgba(0,255,136,.06)}
#fps-val{font-size:36px!important;background:linear-gradient(135deg,#00ff88,#00ccff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
#status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;animation:glow 1.5s infinite}
@keyframes glow{0%,100%{box-shadow:0 0 6px currentColor}50%{box-shadow:0 0 16px currentColor}}
#fps-graph{width:100%;height:40px;margin-top:4px;border-radius:6px;overflow:hidden;background:rgba(255,255,255,.03)}
#fps-graph canvas{width:100%;height:100%}
#controls{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);pointer-events:none;z-index:10;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#controls button{pointer-events:all;padding:10px 18px;font-size:12px;font-family:'Orbitron',monospace;font-weight:700;letter-spacing:1px;border:none;border-radius:8px;cursor:pointer;transition:all .15s;text-transform:uppercase}
.btn-add{background:rgba(0,255,136,.15);color:#00ff88;border:1px solid rgba(0,255,136,.3)}
.btn-add:active{background:rgba(0,255,136,.35);transform:scale(.94)}
.btn-warn{background:rgba(255,170,0,.15);color:#ffaa00;border:1px solid rgba(255,170,0,.3)}
.btn-warn:active{background:rgba(255,170,0,.35);transform:scale(.94)}
.btn-danger{background:rgba(255,50,80,.15);color:#ff3250;border:1px solid rgba(255,50,80,.3)}
.btn-danger:active{background:rgba(255,50,80,.35);transform:scale(.94)}
.btn-reset{background:rgba(255,255,255,.06);color:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.1)}
.btn-reset:active{background:rgba(255,255,255,.15);transform:scale(.94)}
#tap-hint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;text-align:center;transition:opacity .5s}
#tap-hint .icon{font-size:48px;animation:float 2s ease-in-out infinite}
#tap-hint .text{font-size:13px;color:rgba(255,255,255,.35);letter-spacing:2px;margin-top:8px;font-family:'Orbitron',monospace}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
#crash-warn{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(255,30,60,.95);color:#fff;padding:12px 24px;border-radius:10px;font-size:13px;font-family:'Orbitron',monospace;font-weight:700;letter-spacing:1px;display:none;z-index:100;pointer-events:none;animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(-50%)}25%{transform:translateX(calc(-50% - 4px))}75%{transform:translateX(calc(-50% + 4px))}}
</style>
</head>
<body>
<div id="hud">
  <div class="hud-row">
    <div class="hud-card" id="fps-card">
      <div class="label">FRAMES / SEC</div>
      <div class="value" id="fps-val">--</div>
    </div>
    <div class="hud-card">
      <div class="label">MODELS</div>
      <div class="value" id="model-count">0</div>
    </div>
    <div class="hud-card">
      <div class="label">VERTICES</div>
      <div class="value" id="vert-count">0</div>
    </div>
    <div class="hud-card">
      <div class="label">MEMORY</div>
      <div class="value" id="mem-val">--</div>
    </div>
    <div class="hud-card">
      <div class="label">STATUS</div>
      <div class="value" id="status-val" style="font-size:14px"><span id="status-dot" style="background:#00ff88;color:#00ff88"></span>READY</div>
    </div>
  </div>
  <div id="fps-graph"><canvas id="fps-graph-canvas"></canvas></div>
</div>
<div id="tap-hint"><div class="icon">👆</div><div class="text">TAP TO SPAWN</div></div>
<div id="controls">
  <button class="btn-add" onclick="addModels(1)">+1</button>
  <button class="btn-add" onclick="addModels(5)">+5</button>
  <button class="btn-warn" onclick="addModels(20)">+20</button>
  <button class="btn-warn" onclick="addModels(50)">+50</button>
  <button class="btn-danger" onclick="addParticles(500)">+500 ⬡</button>
  <button class="btn-reset" onclick="resetAll()">↺ RESET</button>
</div>
<div id="crash-warn">⚠ LOW FPS — REDUCE MODEL COUNT</div>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

// ==================== 场景 ====================
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x050510, 0.00008);
scene.background = new THREE.Color(0x050510);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.5, 200);
camera.position.set(0, 9, 28);
camera.lookAt(0, 0, 0);

// 灯光
scene.add(new THREE.AmbientLight(0x1a1a3a, 0.6));

const sun = new THREE.DirectionalLight(0xffeedd, 4);
sun.position.set(15, 25, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1; sun.shadow.camera.far = 80;
sun.shadow.camera.left = -30; sun.shadow.camera.right = 30;
sun.shadow.camera.top = 30; sun.shadow.camera.bottom = -30;
sun.shadow.bias = -0.0001;
sun.shadow.normalBias = 0.02;
scene.add(sun);

// 彩色点光源
const pointLights = [];
const lightColors = [0xff3366, 0x33ff66, 0x3366ff, 0xff33ff, 0xffcc00, 0x00ffcc];
for (let i = 0; i < 6; i++) {
  const pl = new THREE.PointLight(lightColors[i], 60, 22);
  pl.position.set(Math.cos(i*Math.PI/3)*14, 4+Math.random()*5, Math.sin(i*Math.PI/3)*14);
  pl.castShadow = true;
  pl.shadow.mapSize.set(256, 256);
  scene.add(pl);
  pointLights.push(pl);
}

// 地面
const groundGeo = new THREE.PlaneGeometry(70, 70);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x0a0a1e, roughness: 0.6, metalness: 0.5 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI/2; ground.position.y = -5.5;
ground.receiveShadow = true;
scene.add(ground);

// 网格
const grid = new THREE.PolarGridHelper(28, 40, 28, 256, 0x223355, 0x223355);
grid.position.y = -5.48;
scene.add(grid);

// 粒子背景星空
const starsGeo = new THREE.BufferGeometry();
const starsCount = 600;
const starsPos = new Float32Array(starsCount*3);
for(let i=0;i<starsCount;i++){starsPos[i*3]=(Math.random()-.5)*60;starsPos[i*3+1]=Math.random()*25;starsPos[i*3+2]=(Math.random()-.5)*60}
starsGeo.setAttribute('position',new THREE.BufferAttribute(starsPos,3));
const starsMat = new THREE.PointsMaterial({size:.06,color:0x8899cc,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:.6});
scene.add(new THREE.Points(starsGeo,starsMat));

// ==================== 模型系统 ====================
const models = [];
const modelGroup = new THREE.Group();
scene.add(modelGroup);

// 材质预设
const matPresets = [
  () => new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(Math.random(),.7,.5+Math.random()*.3), roughness:.15, metalness:.95 }),
  () => new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(Math.random(),.8,.55+Math.random()*.25), roughness:.25, metalness:.05 }),
  () => { const c=new THREE.Color().setHSL(Math.random(),.9,.5); return new THREE.MeshStandardMaterial({ color:c, roughness:.3, metalness:.4, emissive:c, emissiveIntensity:.5 }) },
  () => new THREE.MeshPhysicalMaterial({ color: new THREE.Color().setHSL(Math.random(),.6,.6), roughness:.05, metalness:.1, clearcoat:.6, clearcoatRoughness:.2, transparent:true, opacity:.75 }),
  () => new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(Math.random(),.5,.4), roughness:.4, metalness:.6, wireframe:true }),
];

function createRandomGeometry() {
  const r = Math.random();
  if (r < .15) return new THREE.TorusKnotGeometry(.7,.25,200,24,2,3);
  if (r < .30) return new THREE.TorusKnotGeometry(.8,.2,160,20,3,4);
  if (r < .45) return new THREE.IcosahedronGeometry(1,3);
  if (r < .58) return new THREE.DodecahedronGeometry(1,2);
  if (r < .70) return new THREE.TorusGeometry(.9,.35,48,32);
  if (r < .80) return new THREE.SphereGeometry(1,64,48);
  if (r < .88) return new THREE.CylinderGeometry(.6,.8,2.5,48,20);
  return new THREE.OctahedronGeometry(1,3);
}

function addModels(count) {
  for (let i = 0; i < count; i++) {
    const geo = createRandomGeometry();
    const mat = matPresets[Math.floor(Math.random()*matPresets.length)]();
    const mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow = true;
    mesh.receiveShadow = true;

    const angle = Math.random()*Math.PI*2;
    const radius = 4+Math.random()*16;
    mesh.position.set(Math.cos(angle)*radius, -3+Math.random()*9, Math.sin(angle)*radius);
    mesh.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);

    mesh.userData = {
      rotSpeed: { x:(Math.random()-.5)*1.5, y:(Math.random()-.5)*1.5, z:(Math.random()-.5)*1.5 },
      floatSpeed: .6+Math.random()*1.8,
      floatAmp: .4+Math.random()*1.8,
      floatPhase: Math.random()*Math.PI*2,
      baseY: mesh.position.y,
      pulsePhase: Math.random()*Math.PI*2,
      pulseSpeed: 1.2+Math.random()*2.5,
      orbitRadius: radius,
      orbitSpeed: (Math.random()-.5)*.4,
      orbitAngle: angle,
    };

    modelGroup.add(mesh);
    models.push(mesh);
  }
  updateHUD();
}

// ==================== 粒子 ====================
const particlesGroup = new THREE.Group();
scene.add(particlesGroup);
let particleSystems = [];

function addParticles(count) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count*3);
  const col = new Float32Array(count*3);
  for(let i=0;i<count;i++){
    pos[i*3]=(Math.random()-.5)*32;pos[i*3+1]=(Math.random()-.5)*18;pos[i*3+2]=(Math.random()-.5)*32;
    const c=new THREE.Color().setHSL(Math.random(),.95,.6);col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;
  }
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  const mat = new THREE.PointsMaterial({size:.12,vertexColors:true,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:.85});
  const pts = new THREE.Points(geo,mat);
  pts.userData = { vels: Array.from({length:count},()=>({x:(Math.random()-.5)*.04,y:(Math.random()-.5)*.04,z:(Math.random()-.5)*.04})) };
  particlesGroup.add(pts);
  particleSystems.push(pts);
  updateHUD();
}

// ==================== 装饰环 ====================
const ringGroup = new THREE.Group();
scene.add(ringGroup);
for(let i=0;i<4;i++){
  const rg = new THREE.TorusGeometry(7+i*3.5,.03,16,160);
  const rm = new THREE.MeshBasicMaterial({color:new THREE.Color().setHSL(i*.25,.9,.5),transparent:true,opacity:.35});
  const r = new THREE.Mesh(rg,rm);
  r.rotation.x=Math.PI/2+i*.25;
  r.userData={speed:.25+i*.15};
  ringGroup.add(r);
}

// ==================== HUD ====================
const graphCanvas = document.getElementById('fps-graph-canvas');
const graphCtx = graphCanvas.getContext('2d');
let fpsHistory = [];

function updateHUD() {
  document.getElementById('model-count').textContent = models.length;
  const pCount = particleSystems.reduce((s,p)=>s+p.geometry.attributes.position.count,0);
  document.getElementById('particle-count')?.remove();
  const tv = models.reduce((s,m)=>s+(m.geometry.index?m.geometry.index.count:m.geometry.attributes.position.count),0);
  document.getElementById('vert-count').textContent = tv>1000?(tv/1000).toFixed(1)+'K':tv;
  if(performance.memory) document.getElementById('mem-val').textContent = (performance.memory.usedJSHeapSize/1048576).toFixed(0)+'MB';
}

function updateFPS(fps) {
  fpsHistory.push(fps);
  if(fpsHistory.length>120) fpsHistory.shift();

  document.getElementById('fps-val').textContent = Math.round(fps);
  const dot = document.getElementById('status-dot');
  const status = document.getElementById('status-val').childNodes[1]||document.getElementById('status-val');

  if(fps>=55){dot.style.background='#00ff88';dot.style.color='#00ff88';document.getElementById('status-val').childNodes[1]&&(document.getElementById('status-val').childNodes[1].textContent='SMOOTH')}
  else if(fps>=35){dot.style.background='#ffcc00';dot.style.color='#ffcc00';document.getElementById('status-val').childNodes[1]&&(document.getElementById('status-val').childNodes[1].textContent='PLAYABLE')}
  else if(fps>=18){dot.style.background='#ff8800';dot.style.color='#ff8800';document.getElementById('status-val').childNodes[1]&&(document.getElementById('status-val').childNodes[1].textContent='LAGGY')}
  else{dot.style.background='#ff2244';dot.style.color='#ff2244';document.getElementById('status-val').childNodes[1]&&(document.getElementById('status-val').childNodes[1].textContent='CRITICAL')}

  document.getElementById('crash-warn').style.display = (fps<12&&models.length>8)?'block':'none';

  // FPS 曲线图
  graphCanvas.width = graphCanvas.parentElement.clientWidth * 2;
  graphCanvas.height = 80;
  const gw = graphCanvas.width, gh = graphCanvas.height;
  graphCtx.clearRect(0,0,gw,gh);
  graphCtx.strokeStyle = 'rgba(0,255,136,.3)';
  graphCtx.lineWidth = 2;
  graphCtx.beginPath();
  const maxFPS = 120;
  for(let i=0;i<fpsHistory.length;i++){
    const x = i/fpsHistory.length*gw;
    const y = gh-(fpsHistory[i]/maxFPS)*gh;
    if(i===0) graphCtx.moveTo(x,y); else graphCtx.lineTo(x,y);
  }
  graphCtx.stroke();
  // 渐变填充
  const grad = graphCtx.createLinearGradient(0,0,0,gh);
  grad.addColorStop(0,'rgba(0,255,136,.15)');grad.addColorStop(1,'rgba(0,255,136,0)');
  graphCtx.lineTo(gw,gh);graphCtx.lineTo(0,gh);graphCtx.closePath();
  graphCtx.fillStyle = grad;graphCtx.fill();
}

// ==================== 主循环（120fps上限） ====================
const clock = new THREE.Clock();
let frameCount=0,fpsTime=0,currentFPS=60;
const TARGET_FRAME_TIME = 1000/120;

function animate(timestamp) {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.1);
  const time = performance.now()*.001;

  frameCount++;fpsTime+=dt;
  if(fpsTime>=.5){currentFPS=Math.round(frameCount/fpsTime);frameCount=0;fpsTime=0;updateFPS(currentFPS);updateHUD()}

  // 模型动画
  for(const mesh of models){
    const ud=mesh.userData;
    mesh.rotation.x+=ud.rotSpeed.x*dt;mesh.rotation.y+=ud.rotSpeed.y*dt;mesh.rotation.z+=ud.rotSpeed.z*dt;
    mesh.position.y=ud.baseY+Math.sin(time*ud.floatSpeed+ud.floatPhase)*ud.floatAmp;
    const pulse=1+Math.sin(time*ud.pulseSpeed+ud.pulsePhase)*.12;
    mesh.scale.setScalar(pulse);
    ud.orbitAngle+=ud.orbitSpeed*dt;
    mesh.position.x=Math.cos(ud.orbitAngle)*ud.orbitRadius;
    mesh.position.z=Math.sin(ud.orbitAngle)*ud.orbitRadius;
  }

  // 粒子
  for(const ps of particleSystems){
    const pos=ps.geometry.attributes.position.array;
    const vels=ps.userData.vels;
    for(let i=0;i<pos.length/3;i++){
      pos[i*3]+=vels[i].x;pos[i*3+1]+=vels[i].y;pos[i*3+2]+=vels[i].z;
      if(Math.abs(pos[i*3])>16)vels[i].x*=-1;if(Math.abs(pos[i*3+1])>9)vels[i].y*=-1;if(Math.abs(pos[i*3+2])>16)vels[i].z*=-1;
    }
    ps.geometry.attributes.position.needsUpdate=true;
  }

  // 灯光
  for(let i=0;i<pointLights.length;i++){
    const pl=pointLights[i];
    pl.position.x=Math.cos(time*.6+i*Math.PI/3)*14;
    pl.position.z=Math.sin(time*.6+i*Math.PI/3)*14;
    pl.intensity=40+Math.sin(time*2.5+i)*25;
  }

  // 环
  for(const ring of ringGroup.children) ring.rotation.z+=ring.userData.speed*dt;

  // 相机
  camera.position.x=Math.sin(time*.15)*4;
  camera.position.y=9+Math.sin(time*.25)*2;
  camera.lookAt(0,0,0);

  renderer.render(scene,camera);
}

// ==================== 事件 ====================
renderer.domElement.addEventListener('click',e=>{
  if(e.clientY>window.innerHeight-80)return;
  addModels(1);
  document.getElementById('tap-hint').style.opacity='0';
});
renderer.domElement.addEventListener('touchstart',e=>{
  if(e.touches[0].clientY>window.innerHeight-80)return;
  addModels(1);
  document.getElementById('tap-hint').style.opacity='0';
},{passive:true});

window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

window.addModels=addModels;
window.addParticles=addParticles;
window.resetAll=()=>{
  while(modelGroup.children.length>0)modelGroup.remove(modelGroup.children[0]);
  models.length=0;
  while(particlesGroup.children.length>0)particlesGroup.remove(particlesGroup.children[0]);
  particleSystems.length=0;
  fpsHistory=[];
  updateHUD();
  document.getElementById('tap-hint').style.opacity='1';
  document.getElementById('crash-warn').style.display='none';
  document.getElementById('status-val').childNodes[1]&&(document.getElementById('status-val').childNodes[1].textContent='READY');
  document.getElementById('status-dot').style.background='#00ff88';
  document.getElementById('status-dot').style.color='#00ff88';
};

// 启动
addModels(3);
addParticles(200);
requestAnimationFrame(animate);
updateHUD();
</script>
</body>
</html>
