<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🔫 FPS Arena</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;overflow:hidden;font-family:'Courier New',monospace;user-select:none}
canvas{display:block;cursor:none}
#ui{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}
#crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:20px;height:20px}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:rgba(255,255,255,.85)}
#crosshair::before{top:8px;left:0;width:20px;height:2px}
#crosshair::after{top:0;left:8px;width:2px;height:20px}
#hud{position:absolute;bottom:30px;left:30px;color:#fff;font-size:13px;text-shadow:0 0 8px rgba(0,0,0,.8)}
.bar{width:180px;height:5px;background:rgba(255,255,255,.2);border-radius:3px;margin:3px 0;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width .3s}
.hp{background:#f44}.ammo-bar{background:#fa0}
#score{position:absolute;top:25px;right:25px;color:#fff;font-size:22px;text-shadow:0 0 10px rgba(0,0,0,.8)}
#weapon{position:absolute;bottom:30px;right:25px;color:#fa0;font-size:14px;text-shadow:0 0 8px rgba(0,0,0,.8)}
#dmg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#f00;font-size:36px;font-weight:bold;opacity:0;text-shadow:0 0 15px rgba(255,0,0,.8)}
#msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;text-align:center;text-shadow:0 0 20px rgba(0,0,0,.9)}
#msg h1{font-size:42px;margin-bottom:8px}
#msg p{font-size:14px;color:#aaa;margin-bottom:16px}
#msg button{pointer-events:all;padding:10px 36px;font-size:16px;background:#f44;color:#fff;border:none;border-radius:4px;cursor:pointer;font-family:inherit}
#msg button:hover{background:#f66}
.hidden{display:none!important}
#killfeed{position:absolute;top:70px;right:25px;color:#fff;font-size:12px;text-align:right}
.kill-msg{animation:fadeOut 3s forwards;margin:2px 0}
@keyframes fadeOut{0%{opacity:1}70%{opacity:1}100%{opacity:0}}
#minimap{position:absolute;bottom:30px;left:240px;width:100px;height:100px;border:2px solid rgba(255,255,255,.3);border-radius:50%;overflow:hidden;background:rgba(0,0,0,.5)}
#minimap canvas{width:100%;height:100%}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
<div id="crosshair"></div>
<div id="hud">
<div>❤️ <span id="hpText">100</span></div>
<div class="bar"><div class="bar-fill hp" id="hpBar" style="width:100%"></div></div>
<div style="margin-top:6px">🔫 <span id="ammoText">30</span>/<span id="ammoMax">30</span></div>
<div class="bar"><div class="bar-fill ammo-bar" id="ammoBar" style="width:100%"></div></div>
</div>
<div id="score">🏆 <span id="scoreText">0</span></div>
<div id="weapon">🔫 <span id="weaponText">手枪</span> [1-4]</div>
<div id="dmg"></div>
<div id="killfeed"></div>
<div id="minimap"><canvas id="minimapCanvas" width="100" height="100"></canvas></div>
<div id="msg">
<h1>🔫 FPS Arena</h1>
<p>WASD移动 | 鼠标瞄准 | 左键射击 | R换弹 | 1-4武器 | Shift冲刺</p>
<button onclick="startGame()">开始战斗</button>
</div>
</div>
<script src="game.js"></script>
</body>
</html>
