<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>大鱼吃小鱼</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a2e;font-family:'Segoe UI',system-ui,sans-serif;touch-action:manipulation}
#game-container{position:relative;width:100vw;height:100vh;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;top:0;left:0;width:100%;pointer-events:none;padding:max(8px,1.5vw) max(12px,2vw);display:flex;justify-content:space-between;align-items:flex-start;z-index:10}
.ui-card{background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.12);border-radius:max(8px,1vw);padding:max(6px,1vw) max(10px,1.5vw);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.ui-label{font-size:max(8px,1.2vw);color:rgba(255,255,255,.45);letter-spacing:2px;text-transform:uppercase}
.ui-value{font-size:max(18px,3.5vw);font-weight:800;color:#fff;line-height:1.2}
#score-val{color:#00ff88}
#timer-val{color:#ffcc00}
#timer-val.urgent{color:#ff3366;animation:pulse .5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
#overlay{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;pointer-events:none;transition:opacity .4s;z-index:20;background:rgba(5,5,30,.75)}
#overlay.hidden{opacity:0;pointer-events:none}
#overlay .title{font-size:max(32px,6vw);font-weight:900;color:#fff;text-shadow:0 0 30px rgba(0,200,255,.6);margin-bottom:max(6px,1vw);letter-spacing:2px;text-align:center}
#overlay .subtitle{font-size:max(12px,2vw);color:rgba(255,255,255,.5);margin-bottom:max(18px,3vw);letter-spacing:1px;text-align:center}
#overlay button{pointer-events:all;padding:max(10px,1.5vw) max(28px,5vw);font-size:max(14px,2.2vw);font-weight:700;letter-spacing:1px;border:none;border-radius:max(8px,1.2vw);cursor:pointer;background:linear-gradient(135deg,#00cc66,#00aa88);color:#fff;box-shadow:0 4px 20px rgba(0,200,100,.3);transition:all .2s}
#overlay button:active{transform:scale(.94)}
#overlay .win-title{color:#ffcc00;text-shadow:0 0 40px rgba(255,200,0,.7)}
#overlay .lose-title{color:#ff3366;text-shadow:0 0 40px rgba(255,50,100,.7)}
</style>
</head>
<body>
<div id="game-container">
  <canvas id="canvas"></canvas>
  <div id="ui">
    <div class="ui-card"><div class="ui-label">得分</div><div class="ui-value" id="score-val">0</div></div>
    <div class="ui-card"><div class="ui-label">目标</div><div class="ui-value" style="font-size:max(12px,2vw);color:rgba(255,255,255,.5)">1000</div></div>
    <div class="ui-card"><div class="ui-label">时间</div><div class="ui-value" id="timer-val">60</div></div>
  </div>
  <div id="overlay">
    <div class="title" id="overlay-title">🐟 大鱼吃小鱼</div>
    <div class="subtitle" id="overlay-sub">吃掉比你小的鱼 · 60秒内达到1000分</div>
    <button id="overlay-btn" onclick="startGame()">开始游戏</button>
  </div>
</div>

<script>
// ==================== 游戏常量 ====================
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;

function resizeCanvas() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;
}
resizeCanvas();
window.addEventListener('resize', () => { resizeCanvas(); if(player) updatePlayerBounds(); });

// ==================== DOM 引用 ====================
const scoreEl = document.getElementById('score-val');
const timerEl = document.getElementById('timer-val');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlay-title');
const overlaySub = document.getElementById('overlay-sub');
const overlayBtn = document.getElementById('overlay-btn');

// ==================== 游戏状态 ====================
const GAME_TIME = 60;
const WIN_SCORE = 1000;
const NPC_COUNT = 15; // 从25减至15，更舒适

let player, npcs, score, timeLeft, gameRunning, gameOver, gameWin;
let mouseX = 0, mouseY = 0, touchActive = false; // 修复：声明时初始化

// ==================== 气泡粒子 ====================
let bubbles = [];
function initBubbles() {
  bubbles = [];
  const count = Math.floor(W*H/12000); // 根据屏幕大小动态气泡数
  for (let i = 0; i < count; i++) {
    bubbles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: 1 + Math.random() * 3,
      speed: .3 + Math.random() * .8,
      opacity: .15 + Math.random() * .25
    });
  }
}

// ==================== 鱼 ====================
class Fish {
  constructor(x, y, size, isPlayer) {
    this.x = x;
    this.y = y;
    this.size = size;
    this.isPlayer = isPlayer;
    this.angle = Math.random() * Math.PI * 2;
    this.speed = isPlayer ? 3.5 : (1.2 + Math.random() * 1.8);
    if (isPlayer) this.baseSpeed = 3.5;
    this.vx = Math.cos(this.angle) * this.speed * .6;
    this.vy = Math.sin(this.angle) * this.speed * .6;
    this.tailPhase = Math.random() * Math.PI * 2;
    this.color = this.pickColor();
    this.eyeColor = '#fff';
    this.turnTimer = 60 + Math.random() * 120;
    this.turnCooldown = 0;
  }

  pickColor() {
    if (this.isPlayer) return '#4dc9f6';
    const ratio = this.size / 50;
    if (ratio < .35) return `hsl(${140+Math.random()*40},70%,${50+Math.random()*20}%)`;
    if (ratio < .65) return `hsl(${30+Math.random()*30},75%,${48+Math.random()*18}%)`;
    return `hsl(${0+Math.random()*15},80%,${45+Math.random()*20}%)`;
  }

  update() {
    if (this.isPlayer) {
      if (touchActive || mouseX !== undefined) {
        const tx = mouseX, ty = mouseY; // 修复：移除冗余三元表达式
        if (tx !== undefined && ty !== undefined) {
          const dx = tx - this.x, dy = ty - this.y;
          const dist = Math.sqrt(dx*dx+dy*dy);
          if (dist > 3) {
            this.angle = Math.atan2(dy, dx);
            const speedMod = Math.max(.55, 1 - (this.size-12)/80);
            const spd = this.baseSpeed * speedMod;
            this.vx = (dx/dist) * spd;
            this.vy = (dy/dist) * spd;
          } else {
            this.vx *= .85; this.vy *= .85;
          }
        }
      }
    } else {
      this.turnCooldown--;
      if (this.turnCooldown <= 0) {
        this.angle += (Math.random()-.5) * .8;
        this.turnCooldown = this.turnTimer;
        this.turnTimer = 50 + Math.random() * 100;
      }
      this.vx = Math.cos(this.angle) * this.speed;
      this.vy = Math.sin(this.angle) * this.speed;
    }

    this.x += this.vx;
    this.y += this.vy;

    // 边界反弹
    const margin = this.size;
    if (this.x < margin) { this.x = margin; this.vx *= -.5; this.angle = Math.PI - this.angle; }
    if (this.x > W - margin) { this.x = W - margin; this.vx *= -.5; this.angle = Math.PI - this.angle; }
    if (this.y < margin) { this.y = margin; this.vy *= -.5; this.angle = -this.angle; }
    if (this.y > H - margin) { this.y = H - margin; this.vy *= -.5; this.angle = -this.angle; }

    this.tailPhase += .15;
  }

  draw(ctx, time) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);

    const s = this.size;
    const bodyLen = s * 2.2;
    const bodyH = s * 1.4;

    // 阴影
    ctx.shadowColor = 'rgba(0,0,0,.25)';
    ctx.shadowBlur = s * .3;
    ctx.shadowOffsetY = 2;

    // 身体
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.ellipse(0, 0, bodyLen*.5, bodyH*.5, 0, 0, Math.PI*2);
    ctx.fill();

    // 肚皮
    ctx.fillStyle = 'rgba(255,255,255,.15)';
    ctx.beginPath();
    ctx.ellipse(-s*.15, -s*.15, bodyLen*.35, bodyH*.3, 0, 0, Math.PI*2);
    ctx.fill();

    // 尾巴
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.moveTo(-bodyLen*.45, 0);
    ctx.quadraticCurveTo(-bodyLen*.7, -bodyH*.55, -bodyLen*.85 - Math.sin(this.tailPhase)*s*.3, -bodyH*.25);
    ctx.quadraticCurveTo(-bodyLen*.65, 0, -bodyLen*.85 - Math.sin(this.tailPhase)*s*.3, bodyH*.25);
    ctx.quadraticCurveTo(-bodyLen*.7, bodyH*.55, -bodyLen*.45, 0);
    ctx.fill();

    // 背鳍
    ctx.fillStyle = 'rgba(0,0,0,.2)';
    ctx.beginPath();
    ctx.moveTo(-s*.2, -bodyH*.45);
    ctx.quadraticCurveTo(s*.1, -bodyH*.85, s*.6, -bodyH*.4);
    ctx.quadraticCurveTo(s*.2, -bodyH*.5, -s*.2, -bodyH*.45);
    ctx.fill();

    // 胸鳍
    ctx.fillStyle = 'rgba(0,0,0,.15)';
    ctx.beginPath();
    ctx.ellipse(s*.15, bodyH*.35, s*.45, s*.2, .3, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(s*.15, -bodyH*.35, s*.45, s*.2, -.3, 0, Math.PI*2);
    ctx.fill();

    // 眼睛
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    const eyeX = bodyLen*.28, eyeY = -bodyH*.18;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(eyeX, eyeY, s*.22, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(eyeX+s*.06, eyeY, s*.12, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(eyeX+s*.02, eyeY-s*.06, s*.05, 0, Math.PI*2);
    ctx.fill();

    // 嘴
    ctx.strokeStyle = 'rgba(0,0,0,.3)';
    ctx.lineWidth = s*.06;
    ctx.beginPath();
    ctx.arc(bodyLen*.42, bodyH*.08, s*.15, -.3, .8);
    ctx.stroke();

    ctx.restore();

    // 大小标签（仅大 NPC）
    if (!this.isPlayer && this.size > 18) {
      ctx.fillStyle = 'rgba(255,255,255,.5)';
      ctx.font = `${Math.max(9,this.size*.4)}px system-ui`;
      ctx.textAlign = 'center';
      ctx.fillText(Math.round(this.size), this.x, this.y - this.size - 8);
    }
  }
}

// ==================== 初始化 ====================
function createPlayer() {
  const p = new Fish(W/2, H/2, 14, true);
  p.baseSpeed = 3.5;
  return p;
}

function createNPC() {
  // 优化分布：60%小鱼，30%中鱼，10%大鱼
  const r = Math.random();
  let size;
  if (r < .60) size = 6 + Math.random() * 12;       // 小鱼 6-18（60%）
  else if (r < .90) size = 14 + Math.random() * 16;  // 中鱼 14-30（30%）
  else size = 22 + Math.random() * 20;                // 大鱼 22-42（10%）

  // 安全生成（带最大尝试次数）
  let x, y, attempts = 0;
  do {
    x = 40 + Math.random() * (W-80);
    y = 40 + Math.random() * (H-80);
    attempts++;
  } while (player && Math.hypot(x-player.x, y-player.y) < Math.min(W,H)*.12 && attempts < 100);

  return new Fish(x, y, size, false);
}

function initGame() {
  player = createPlayer();
  npcs = [];
  for (let i = 0; i < NPC_COUNT; i++) npcs.push(createNPC());
  score = 0;
  timeLeft = GAME_TIME;
  gameRunning = false;
  gameOver = false;
  gameWin = false;
  mouseX = W/2; mouseY = H/2;
  touchActive = false;
  initBubbles();
  updateUI();
}

function updatePlayerBounds() {
  // 窗口大小变化时修正玩家位置
  if (player) {
    player.x = Math.min(player.x, W - player.size);
    player.y = Math.min(player.y, H - player.size);
  }
}

// ==================== UI ====================
function updateUI() {
  scoreEl.textContent = score;
  timerEl.textContent = timeLeft;
  if (timeLeft <= 10) timerEl.classList.add('urgent');
  else timerEl.classList.remove('urgent');
}

function showOverlay(title, sub, btnText, titleClass) {
  overlayTitle.textContent = title;
  overlayTitle.className = 'title ' + (titleClass||'');
  overlaySub.textContent = sub;
  overlayBtn.textContent = btnText;
  overlay.classList.remove('hidden');
}

// ==================== 游戏循环 ====================
let lastTime = 0;
let timerAccum = 0;

function gameLoop(timestamp) {
  if (!lastTime) lastTime = timestamp;
  const dt = Math.min((timestamp - lastTime) / 1000, .1);
  lastTime = timestamp;

  if (gameRunning && !gameOver && !gameWin) {
    timerAccum += dt;
    if (timerAccum >= 1) {
      timerAccum -= 1;
      timeLeft--;
      updateUI();
      if (timeLeft <= 0) { endGame(false); return; }
    }

    player.update();
    for (const npc of npcs) npc.update();

    // 碰撞检测
    for (let i = npcs.length-1; i >= 0; i--) {
      const n = npcs[i];
      const dist = Math.hypot(player.x-n.x, player.y-n.y);
      const touchDist = (player.size + n.size) * .7;

      if (dist < touchDist) {
        if (player.size > n.size * 1.05) {
          score += Math.floor(n.size * 2);
          player.size += n.size * .08;
          player.baseSpeed = Math.max(2.2, 3.5 - (player.size-12)*.03);
          npcs.splice(i, 1);
          npcs.push(createNPC()); // 新鱼下帧才参与碰撞检测
          updateUI();
          if (score >= WIN_SCORE) { endGame(true); return; }
        } else if (n.size > player.size * 1.05) {
          endGame(false); return;
        }
      }
    }

    for (const b of bubbles) {
      b.y -= b.speed;
      if (b.y < -10) { b.y = H+10; b.x = Math.random()*W; }
    }
  }

  draw(timestamp);
  requestAnimationFrame(gameLoop);
}

function draw(timestamp) {
  const time = timestamp * .001; // 统一时间，避免多次 Date.now()
  ctx.clearRect(0, 0, W, H);

  // 背景渐变
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0a1040');
  bg.addColorStop(.4, '#0d2060');
  bg.addColorStop(.7, '#103070');
  bg.addColorStop(1, '#0a2050');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // 海底光效
  ctx.fillStyle = 'rgba(0,180,255,.03)';
  const lightCount = Math.floor(W/160);
  for (let i = 0; i < lightCount; i++) {
    ctx.beginPath();
    ctx.ellipse(W*.2+i*W*.15, H*.7, W*.25, H*.12, .1, 0, Math.PI*2);
    ctx.fill();
  }

  // 气泡
  for (const b of bubbles) {
    ctx.fillStyle = `rgba(180,220,255,${b.opacity})`;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = `rgba(255,255,255,${b.opacity*.5})`;
    ctx.lineWidth = .5;
    ctx.stroke();
  }

  // 水草
  ctx.strokeStyle = 'rgba(40,140,100,.25)';
  ctx.lineWidth = 2;
  const weedCount = Math.floor(W/100);
  for (let i = 0; i < weedCount; i++) {
    const sx = i*(W/weedCount)+20, sy = H;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.quadraticCurveTo(sx+15+Math.sin(time+i)*8, sy-H*.1, sx+5, sy-H*.2);
    ctx.quadraticCurveTo(sx-10, sy-H*.14, sx+Math.cos(time*1.5+i)*10, sy-H*.08);
    ctx.stroke();
  }

  // NPC
  for (const npc of npcs) npc.draw(ctx, time);

  // 玩家
  if (player) {
    ctx.fillStyle = 'rgba(100,200,255,.08)';
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.size*1.5, 0, Math.PI*2);
    ctx.fill();
    player.draw(ctx, time);
  }
}

function endGame(won) {
  gameRunning = false;
  gameOver = !won;
  gameWin = won;
  if (won) {
    showOverlay('🏆 胜利！', `得分: ${score} · 剩余 ${timeLeft}秒`, '再来一局', 'win-title');
  } else {
    const reason = timeLeft <= 0 ? '时间到！' : '被大鱼吃掉了！';
    showOverlay('💀 游戏结束', `${reason} 最终得分: ${score}`, '重新开始', 'lose-title');
  }
}

function startGame() {
  resizeCanvas();
  initGame();
  gameRunning = true;
  gameOver = false;
  gameWin = false;
  timerAccum = 0;
  lastTime = 0;
  overlay.classList.add('hidden');
  updateUI();
}

// ==================== 输入 ====================
canvas.addEventListener('mousemove', e => {
  mouseX = e.clientX;
  mouseY = e.clientY;
  touchActive = false;
});

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  mouseX = e.touches[0].clientX;
  mouseY = e.touches[0].clientY;
  touchActive = true;
}, { passive: false });

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  mouseX = e.touches[0].clientX;
  mouseY = e.touches[0].clientY;
  touchActive = true;
}, { passive: false });

canvas.addEventListener('touchend', () => { touchActive = false; });

// 键盘
document.addEventListener('keydown', e => {
  if (!gameRunning || !player) return; // 修复：增加 player 空值检查
  const spd = player.baseSpeed * 1.2;
  switch(e.key) {
    case 'ArrowUp': case 'w': player.vy = -spd; player.vx *= .5; break;
    case 'ArrowDown': case 's': player.vy = spd; player.vx *= .5; break;
    case 'ArrowLeft': case 'a': player.vx = -spd; player.vy *= .5; break;
    case 'ArrowRight': case 'd': player.vx = spd; player.vy *= .5; break;
  }
});

// ==================== 启动 ====================
initGame();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
