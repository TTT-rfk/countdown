<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#75b8df"><title>方界：掌中荒野</title>
<style>
:root{--ink:#17202a;--paper:#f4e5bc;--edge:#4a321f;--gold:#ffd45a;--danger:#e5564f;--ok:#64c96b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:"Courier New","Microsoft YaHei",monospace;color:#fff;touch-action:none}
button{font:inherit;color:inherit}.game{position:fixed;inset:0;overflow:hidden;background:#76bce5}.game.shake{animation:shake .18s linear}@keyframes shake{50%{transform:translate(3px,-2px)}}
canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.pixel{border:3px solid #17130f;box-shadow:inset 2px 2px #ffffff55,inset -3px -3px #0007,3px 3px #0005;border-radius:2px;background:#5b4935}
.topbar{position:absolute;left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));height:54px;display:flex;gap:7px;align-items:flex-start;pointer-events:none}
.brand{height:44px;padding:4px 9px;background:#28372b;min-width:128px}.brand b{display:block;color:#ffe58b;font-size:14px;letter-spacing:1px}.brand small{font-size:9px;color:#c8d4c4}.meters{display:flex;flex-direction:column;gap:4px;flex:1;max-width:240px}.meter{height:18px;background:#2c251f;border:2px solid #17130f;position:relative;overflow:hidden}.meter i{display:block;height:100%;transition:width .2s}.meter span{position:absolute;inset:0;text-align:center;font:bold 10px/14px monospace;text-shadow:1px 1px #000}.hp i{background:#d9574f}.food i{background:#d99a3b}.xp i{background:#70b958}
.top-actions{margin-left:auto;display:flex;gap:5px;pointer-events:auto}.icon-btn{width:42px;height:42px;background:#554634;font-size:19px}
.quest{position:absolute;top:68px;left:9px;width:min(260px,63vw);padding:7px 9px;background:#17130fcc;border-left:4px solid var(--gold);font-size:10px;line-height:1.45;pointer-events:none}.quest b{color:#ffe082}.quest.done{border-color:#62d66b}
.toast{position:absolute;left:50%;top:25%;transform:translate(-50%,-10px);background:#17130fee;border:2px solid #f0d895;padding:8px 13px;opacity:0;transition:.2s;pointer-events:none;font-size:12px;text-align:center}.toast.on{opacity:1;transform:translate(-50%,0)}
.cross{position:absolute;left:50%;top:50%;width:20px;height:20px;transform:translate(-50%,-50%);opacity:.8;pointer-events:none}.cross:before,.cross:after{content:"";position:absolute;background:#fff;box-shadow:1px 1px #000}.cross:before{width:14px;height:2px;left:3px;top:9px}.cross:after{height:14px;width:2px;top:3px;left:9px}
.hotbar{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:3px;padding:4px;background:#1c1712bb;border:2px solid #0c0907}.slot{width:47px;height:47px;position:relative;background:#6a5842;border:3px solid #241b13;display:grid;place-items:center;font-size:24px}.slot.sel{border-color:#fff1a6;transform:translateY(-4px)}.slot small{position:absolute;right:2px;bottom:0;font:bold 10px monospace;text-shadow:1px 1px #000}.slot em{position:absolute;left:2px;top:1px;font:9px monospace;color:#ddd}.slot .dur{position:absolute;bottom:1px;left:3px;right:3px;height:3px;background:#222}.slot .dur i{display:block;height:100%;background:#6bd466}
.controls{position:absolute;inset:0;pointer-events:none}.joy{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(80px,calc(env(safe-area-inset-bottom) + 68px));width:112px;height:112px;border:3px solid #ffffff38;border-radius:50%;background:#10182055;pointer-events:auto}.stick{position:absolute;left:33px;top:33px;width:44px;height:44px;border-radius:50%;background:#e8e0caaa;border:3px solid #352d25}
.actions{position:absolute;right:max(15px,env(safe-area-inset-right));bottom:max(76px,calc(env(safe-area-inset-bottom) + 64px));width:145px;height:145px;pointer-events:auto}.act{position:absolute;border-radius:50%;background:#5c4938cc;font-weight:bold;font-size:11px}.jump{right:2px;bottom:56px;width:61px;height:61px;background:#55794dcc}.mine{left:5px;bottom:3px;width:58px;height:58px}.place{left:34px;top:2px;width:53px;height:53px}.attack{right:0;top:0;width:48px;height:48px;background:#7c413acc}
.panel,.screen{position:absolute;inset:0;background:#111a;display:none;place-items:center;padding:12px;z-index:8}.panel.on,.screen.on{display:grid}.window{width:min(720px,100%);max-height:88vh;overflow:auto;background:#d8c497;color:#241b12;border:5px solid #352617;box-shadow:inset 0 0 0 3px #f5e6bd,8px 8px #0008;padding:12px}.window h2{margin:0 0 10px;font-size:20px}.close{float:right;background:#973f38;width:38px;height:34px}.tabs{display:flex;gap:4px;margin-bottom:8px}.tabs button{padding:7px;background:#69543a}.tabs button.on{background:#91744e;color:#fff5bf}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.invslot{aspect-ratio:1;background:#8f7959;border:3px solid #463722;display:grid;place-items:center;font-size:25px;position:relative}.invslot small{position:absolute;right:2px;bottom:1px;font:bold 11px monospace}.craft-list{display:grid;gap:7px}.recipe{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding:8px;background:#b29a71;border:2px solid #5b472d}.recipe button{padding:7px;background:#597044}.recipe button:disabled{filter:grayscale(1);opacity:.5}.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px}.stat{background:#baa67f;padding:8px;border-left:4px solid #634f32}
.start{background:linear-gradient(#72bce7 0 55%,#5d943f 55% 60%,#694d31 60%);z-index:20}.titlebox{text-align:center;color:#fff;text-shadow:4px 4px #243018;max-width:520px}.titlebox h1{font-size:clamp(34px,9vw,68px);margin:0;letter-spacing:-3px;transform:rotate(-2deg)}.titlebox h1 span{color:#ffe46e}.titlebox p{background:#19251ccc;padding:8px;font-size:12px;letter-spacing:2px}.menu{display:grid;gap:8px;width:min(330px,88vw);margin:22px auto}.menu button{padding:13px;background:#5f7d46;font-weight:bold;font-size:16px}.menu button:nth-child(2){background:#73563b}.tips{font-size:10px;line-height:1.6;background:#111a;padding:9px}.death{z-index:30;background:#3b0909c9;text-align:center}.death h2{font-size:38px;text-shadow:4px 4px #000}.death button{padding:12px 24px;background:#6b7f4f}
@media(max-width:600px){.brand{display:none}.hotbar .slot{width:41px;height:41px}.hotbar{bottom:max(7px,env(safe-area-inset-bottom))}.grid{grid-template-columns:repeat(5,1fr)}.quest{top:62px}.meters{max-width:190px}.topbar{height:48px}}@media(min-width:800px){.joy{width:130px;height:130px}.stick{left:40px;top:40px}.hotbar .slot{width:54px;height:54px}}
</style>
</head><body>
<div class="game" id="game"><canvas id="c"></canvas>
<div class="topbar"><div class="brand pixel"><b>方界·荒野</b><small id="dayLabel">第 1 天 · 清晨</small></div><div class="meters"><div class="meter hp"><i id="hpBar"></i><span id="hpText"></span></div><div class="meter food"><i id="foodBar"></i><span id="foodText"></span></div><div class="meter xp"><i id="xpBar"></i><span id="xpText"></span></div></div><div class="top-actions"><button class="icon-btn pixel" id="invBtn">🎒</button><button class="icon-btn pixel" id="pauseBtn">Ⅱ</button></div></div>
<div class="quest" id="quest"></div><div class="toast" id="toast"></div><div class="cross"></div><div class="hotbar" id="hotbar"></div>
<div class="controls"><div class="joy" id="joy"><div class="stick" id="stick"></div></div><div class="actions"><button class="act place pixel" data-act="place">放置</button><button class="act attack pixel" data-act="attack">攻击</button><button class="act mine pixel" data-act="mine">挖掘</button><button class="act jump pixel" data-act="jump">跳跃</button></div></div>
<div class="panel" id="inventory"><div class="window"><button class="close pixel" data-close>×</button><h2>旅行背包</h2><div class="tabs"><button class="on" data-tab="items">物品</button><button data-tab="craft">合成</button><button data-tab="stats">档案</button></div><div id="tabBody"></div></div></div>
<div class="panel" id="pause"><div class="window" style="max-width:390px;text-align:center"><h2>世界已暂停</h2><div class="menu"><button class="pixel" id="resume">继续探索</button><button class="pixel" id="save">保存世界</button><button class="pixel" id="newWorld">生成新世界</button></div><small>进度也会每 30 秒自动保存</small></div></div>
<div class="screen start on" id="start"><div class="titlebox"><h1>方界<span>：掌中荒野</span></h1><p>一块一块，亲手改变整个世界</p><div class="menu"><button class="pixel" id="continue">继续世界</button><button class="pixel" id="startNew">创建新世界</button></div><div class="tips">左侧摇杆移动 · 右侧跳跃/挖掘/放置/攻击<br>点击快捷栏选择物品 · 点击背包合成工具与火把</div></div></div>
<div class="screen death" id="death"><div><h2>你倒在了荒野中</h2><p>背包中的部分材料散落了……</p><button class="pixel" id="respawn">在出生点醒来</button></div></div>
</div>
<script>
(()=>{'use strict';
const c=document.querySelector('#c'),ctx=c.getContext('2d'),G=document.querySelector('#game');let W,H,DPR=1,last=0,running=false,paused=false;
const TILE=32,WORLD_W=180,WORLD_H=64;let world=[],particles=[],mobs=[],drops=[],clouds=[],stars=[],cam={x:0,y:0};
const BLOCK={air:{n:'空气',solid:0},grass:{n:'草方块',solid:1,hard:20,drop:'dirt',col:'#568a3d'},dirt:{n:'泥土',solid:1,hard:18,drop:'dirt',col:'#765334'},stone:{n:'圆石',solid:1,hard:45,drop:'stone',col:'#737776'},wood:{n:'橡木',solid:1,hard:30,drop:'wood',col:'#76512f'},leaf:{n:'树叶',solid:1,hard:10,drop:'leaf',col:'#3d713a'},sand:{n:'沙子',solid:1,hard:16,drop:'sand',col:'#d3b56b'},coal:{n:'煤矿',solid:1,hard:55,drop:'coal',col:'#555858'},iron:{n:'铁矿',solid:1,hard:70,drop:'iron',col:'#9b7f66'},bedrock:{n:'基岩',solid:1,hard:999,col:'#292b31'},plank:{n:'木板',solid:1,hard:22,drop:'plank',col:'#a6793e'},torch:{n:'火把',solid:0,hard:8,drop:'torch',col:'#e99d30'}};
const ITEMS={dirt:'🟫',stone:'🪨',wood:'🪵',leaf:'🍃',sand:'🟨',coal:'⚫',iron:'⛓️',plank:'🟧',torch:'🔥',apple:'🍎',pick:'⛏️',axe:'🪓',sword:'🗡️'};
let P,selected=0,time=0.22,day=1,weather='clear',weatherTimer=60,autosave=0,questIndex=0;
const quests=[{t:'第一步：收集 5 块木头',item:'wood',n:5},{t:'工匠之路：合成一把木镐',item:'pick',n:1},{t:'点亮黑夜：制作 4 根火把',item:'torch',n:4},{t:'石器时代：采集 12 块圆石',item:'stone',n:12},{t:'安稳居所：放置 10 块木板',stat:'placed',n:10}];
function freshPlayer(){return{x:WORLD_W*TILE/2,y:7*TILE,vx:0,vy:0,w:21,h:48,on:false,hp:100,food:100,xp:0,level:1,inv:{dirt:12,wood:2,torch:3,apple:2},hot:['pick','dirt','wood','plank','torch','apple'],tools:{pick:70,axe:70,sword:90},facing:1,attack:0,hurt:0,placed:0,mined:0,kills:0};}
function hash(x){let s=Math.sin(x*127.1+31.7)*43758.5453;return s-Math.floor(s)}
function gen(){world=Array.from({length:WORLD_H},()=>Array(WORLD_W).fill('air'));let ground=26;for(let x=0;x<WORLD_W;x++){ground+=hash(x)>.72?1:hash(x)<.18?-1:0;ground=Math.max(20,Math.min(32,ground));let desert=x>120&&x<150;for(let y=ground;y<WORLD_H;y++){let b=y===WORLD_H-1?'bedrock':y===ground?(desert?'sand':'grass'):y<ground+4?(desert?'sand':'dirt'):'stone';if(y>ground+6&&b==='stone'){let r=hash(x*93+y*17);if(r>.94)b='coal';if(r>.982&&y>38)b='iron';if(hash(x*47+y*71)>.965&&y>ground+7)b='air'}world[y][x]=b}if(!desert&&x%7===0&&hash(x)>.25){let th=3+Math.floor(hash(x+2)*3);for(let k=1;k<=th;k++)if(ground-k>=0)world[ground-k][x]='wood';for(let xx=-2;xx<=2;xx++)for(let yy=-2;yy<=1;yy++)if(Math.abs(xx)+Math.abs(yy)<4&&world[ground-th+yy]?.[x+xx]==='air')world[ground-th+yy][x+xx]='leaf'}}
// spawn clearing
let sx=Math.floor(WORLD_W/2);for(let y=0;y<18;y++)for(let x=sx-3;x<sx+4;x++)world[y][x]='air';P=freshPlayer();P.x=sx*TILE;P.y=10*TILE;mobs=[];drops=[];particles=[];time=.22;day=1;questIndex=0;weather='clear';spawnClouds();}
function spawnClouds(){clouds=Array.from({length:8},(_,i)=>({x:i*300+hash(i)*200,y:50+hash(i+5)*150,s:.5+hash(i+9)}));stars=Array.from({length:70},(_,i)=>({x:hash(i)*2000,y:hash(i+80)*500,a:.4+hash(i+9)*.6}))}
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*DPR;c.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);ctx.imageSmoothingEnabled=false}addEventListener('resize',resize);resize();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const block=(x,y)=>world[y]?.[x]||'bedrock';const solid=(x,y)=>BLOCK[block(x,y)].solid;
function collide(o,axis){let l=Math.floor((o.x-o.w/2)/TILE),r=Math.floor((o.x+o.w/2-1)/TILE),t=Math.floor((o.y-o.h)/TILE),b=Math.floor((o.y-1)/TILE);for(let y=t;y<=b;y++)for(let x=l;x<=r;x++)if(solid(x,y)){if(axis==='x'){if(o.vx>0)o.x=x*TILE-o.w/2;else if(o.vx<0)o.x=(x+1)*TILE+o.w/2;o.vx=0}else{if(o.vy>0){o.y=y*TILE;o.on=true}else if(o.vy<0)o.y=(y+1)*TILE+o.h;o.vy=0}}}
function itemCount(id){return P.inv[id]||0}function add(id,n=1){P.inv[id]=(P.inv[id]||0)+n;toast(`获得 ${ITEMS[id]||'◆'} ${BLOCK[id]?.n||id} ×${n}`);checkQuest();renderHotbar()}
function use(id,n=1){if(itemCount(id)<n)return false;P.inv[id]-=n;if(P.inv[id]<=0)delete P.inv[id];renderHotbar();return true}
function target(){let tx=Math.floor((P.x+P.facing*46)/TILE),ty=Math.floor((P.y-P.h*.55)/TILE);return{x:tx,y:ty}}
function mine(){let q=target(),id=block(q.x,q.y);if(id==='air'||id==='bedrock')return;let tool=P.hot[selected],power=tool==='pick'?2.2:tool==='axe'&&['wood','leaf'].includes(id)?2.5:1;let need=BLOCK[id].hard/power;P._mine=P._mine&&P._mine.x===q.x&&P._mine.y===q.y?P._mine:{x:q.x,y:q.y,v:0};P._mine.v+=8;if(P._mine.v>=need){world[q.y][q.x]='air';let d=BLOCK[id].drop;if(d)drops.push({x:(q.x+.5)*TILE,y:(q.y+.5)*TILE,vx:(Math.random()-.5)*2,vy:-2,id:d});P.mined++;damageTool(tool,1);burst((q.x+.5)*TILE,(q.y+.5)*TILE,BLOCK[id].col);P._mine=null}}
function place(){let q=target(),id=P.hot[selected];if(!BLOCK[id]||block(q.x,q.y)!=='air'||!itemCount(id))return;let bx=q.x*TILE,by=q.y*TILE;if(Math.abs(P.x-(bx+16))<P.w/2+15&&P.y>by&&P.y-P.h<by+32)return;world[q.y][q.x]=id;use(id);P.placed++;checkQuest();burst(bx+16,by+16,BLOCK[id].col)}
function eat(){let id=P.hot[selected];if(id==='apple'&&use('apple')){P.food=clamp(P.food+25,0,100);P.hp=clamp(P.hp+6,0,100);toast('苹果清甜，恢复了体力')}}
function damageTool(id,n){if(!P.tools[id])return;P.tools[id]-=n;if(P.tools[id]<=0){P.tools[id]=0;P.inv[id]=0;toast(`${ITEMS[id]} 工具损坏了`)}renderHotbar()}
function attack(){P.attack=.25;let hit=false;mobs.forEach(m=>{if(Math.abs(m.x-P.x)<65&&Math.abs((m.y-20)-(P.y-25))<45&&Math.sign(m.x-P.x)===P.facing){m.hp-=P.hot[selected]==='sword'?35:14;m.vx=P.facing*5;hit=true;if(m.hp<=0){P.kills++;P.xp+=8;drops.push({x:m.x,y:m.y-15,vx:0,vy:-2,id:Math.random()<.3?'apple':'coal'});m.dead=1}}});if(hit)damageTool(P.hot[selected],1)}
function burst(x,y,col){for(let i=0;i<8;i++)particles.push({x,y,vx:(Math.random()-.5)*5,vy:(Math.random()-1)*4,a:1,col})}
function hurt(n){if(P.hurt>0)return;P.hp-=n;P.hurt=.7;G.classList.add('shake');setTimeout(()=>G.classList.remove('shake'),200);if(P.hp<=0){running=false;document.querySelector('#death').classList.add('on')}}
function checkQuest(){let q=quests[questIndex];if(!q)return;let v=q.item?itemCount(q.item):P[q.stat]||0;if(v>=q.n){questIndex++;P.xp+=15;toast('任务完成！经验 +15');setTimeout(updateQuest,100)}updateQuest()}
function updateQuest(){let q=quests[questIndex],el=document.querySelector('#quest');if(!q){el.innerHTML='<b>✓ 荒野居民</b><br>所有入门任务已经完成';el.classList.add('done');return}let v=q.item?itemCount(q.item):P[q.stat]||0;el.innerHTML=`<b>当前任务</b><br>${q.t}　${Math.min(v,q.n)}/${q.n}`}
function spawnMob(){if(mobs.length>8)return;let night=time<.18||time>.78;if(!night&&Math.random()>.2)return;let x=P.x+(Math.random()<.5?-1:1)*(500+Math.random()*500),gx=clamp(Math.floor(x/TILE),2,WORLD_W-3),gy=0;while(gy<WORLD_H-2&&!solid(gx,gy))gy++;mobs.push({x:gx*TILE,y:gy*TILE,vx:0,vy:0,w:24,h:38,on:0,hp:night?55:30,type:night?'shade':'boar',dir:1,dead:0})}
function update(dt){if(!running||paused)return;time+=dt/180;if(time>=1){time=0;day++}weatherTimer-=dt;if(weatherTimer<0){weather=Math.random()<.25?'rain':'clear';weatherTimer=50+Math.random()*90;toast(weather==='rain'?'乌云聚拢，下雨了':'天空重新放晴')}
P.vx+=input.x*26*dt;P.vx*=Math.pow(.001,dt);P.vx=clamp(P.vx,-4.2,4.2);if(input.x)P.facing=Math.sign(input.x);P.vy+=18*dt;P.vy=clamp(P.vy,-12,12);P.x+=P.vx;collide(P,'x');P.on=false;P.y+=P.vy;collide(P,'y');P.x=clamp(P.x,20,WORLD_W*TILE-20);P.hurt=Math.max(0,P.hurt-dt);P.attack=Math.max(0,P.attack-dt);P.food=Math.max(0,P.food-dt*.055);if(P.food>75&&P.hp<100)P.hp=Math.min(100,P.hp+dt*.18);if(P.food===0)P.hp-=dt*.35;if(P.hp<=0)hurt(999);
if(input.mine)mine();if(P._mine&&!input.mine)P._mine=null;if(Math.random()<dt*.05)spawnMob();
mobs.forEach(m=>{let dx=P.x-m.x;m.dir=Math.sign(dx);m.vx+=m.dir*8*dt;m.vx*=.88;m.vx=clamp(m.vx,-1.7,1.7);m.vy+=18*dt;m.x+=m.vx;collide(m,'x');m.on=false;m.y+=m.vy;collide(m,'y');if(Math.abs(dx)<30&&Math.abs(P.y-m.y)<45)hurt(m.type==='shade'?9:5)});mobs=mobs.filter(m=>!m.dead&&Math.abs(m.x-P.x)<1800);
drops.forEach(d=>{d.vy+=.2;d.x+=d.vx;d.y+=d.vy;let gy=Math.floor(d.y/TILE),gx=Math.floor(d.x/TILE);if(solid(gx,gy)){d.y=gy*TILE-3;d.vy=0;d.vx*=.8}if(Math.abs(d.x-P.x)<34&&Math.abs(d.y-(P.y-20))<40){add(d.id);d.got=1}});drops=drops.filter(d=>!d.got);
particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.a-=dt*1.5});particles=particles.filter(p=>p.a>0);clouds.forEach(q=>{q.x+=dt*5*q.s;if(q.x>WORLD_W*TILE+400)q.x=-400});
let tx=P.x-W/2,ty=P.y-H*.58;cam.x+=(tx-cam.x)*Math.min(1,dt*5);cam.y+=(ty-cam.y)*Math.min(1,dt*5);cam.x=clamp(cam.x,0,WORLD_W*TILE-W);cam.y=clamp(cam.y,0,WORLD_H*TILE-H);autosave+=dt;if(autosave>30){save();autosave=0}updateHUD()}
function drawBlock(id,x,y){let b=BLOCK[id];ctx.fillStyle=b.col;ctx.fillRect(x,y,TILE,TILE);ctx.fillStyle='#ffffff18';ctx.fillRect(x+2,y+2,28,3);ctx.fillStyle='#0000001f';ctx.fillRect(x+27,y,5,32);let seed=(x/TILE*13+y/TILE*7)%17;ctx.fillStyle=id==='stone'||id==='coal'||id==='iron'?'#26262645':'#33200f33';ctx.fillRect(x+5+seed,y+11+(seed%9),5,4);if(id==='grass'){ctx.fillStyle='#72ad4b';ctx.fillRect(x,y,32,7)}if(id==='wood'){ctx.fillStyle='#4d311f';ctx.fillRect(x+8,y,3,32);ctx.fillRect(x+22,y,3,32)}if(id==='leaf'){ctx.fillStyle='#76a65655';ctx.fillRect(x+4,y+4,8,7)}if(id==='coal'){ctx.fillStyle='#202228';ctx.fillRect(x+4,y+5,8,7);ctx.fillRect(x+19,y+18,7,9)}if(id==='iron'){ctx.fillStyle='#c89570';ctx.fillRect(x+5,y+6,8,6);ctx.fillRect(x+19,y+20,7,7)}if(id==='torch'){ctx.fillStyle='#6b3b1e';ctx.fillRect(x+14,y+11,4,20);ctx.fillStyle='#ffd24b';ctx.fillRect(x+11,y+4,10,12)}}
function render(){let sun=Math.max(0,Math.sin(time*Math.PI)),night=1-sun;let sky=weather==='rain'?'#657782':`rgb(${Math.floor(25+95*sun)},${Math.floor(35+150*sun)},${Math.floor(65+170*sun)})`;ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);if(night>.45){ctx.globalAlpha=(night-.45)*1.7;ctx.fillStyle='#fff';stars.forEach(s=>ctx.fillRect((s.x-cam.x*.08)%W,s.y,2,2));ctx.globalAlpha=1}let orbX=time*W*1.25-W*.12,orbY=H*.42-Math.sin(time*Math.PI)*H*.34;ctx.fillStyle=time>.5?'#e7eff8':'#ffe46b';ctx.beginPath();ctx.arc(orbX,orbY,24,0,7);ctx.fill();ctx.globalAlpha=.45;ctx.fillStyle='#e8edf0';clouds.forEach(q=>{let x=q.x-cam.x*.22,y=q.y-cam.y*.05;ctx.fillRect(x,y,100*q.s,20*q.s);ctx.fillRect(x+25*q.s,y-14*q.s,44*q.s,18*q.s)});ctx.globalAlpha=1;
let x0=Math.floor(cam.x/TILE),x1=Math.min(WORLD_W,x0+Math.ceil(W/TILE)+2),y0=Math.max(0,Math.floor(cam.y/TILE)),y1=Math.min(WORLD_H,y0+Math.ceil(H/TILE)+2);for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){let id=world[y][x];if(id!=='air')drawBlock(id,x*TILE-cam.x,y*TILE-cam.y)}
// drops
ctx.font='21px serif';ctx.textAlign='center';drops.forEach(d=>ctx.fillText(ITEMS[d.id]||'◆',d.x-cam.x,d.y-cam.y));
// mobs
mobs.forEach(m=>{let x=m.x-cam.x,y=m.y-cam.y;if(m.type==='shade'){ctx.fillStyle='#313043';ctx.fillRect(x-12,y-38,24,38);ctx.fillStyle='#9df4ff';ctx.fillRect(x-7,y-30,4,4);ctx.fillRect(x+4,y-30,4,4)}else{ctx.fillStyle='#8b5232';ctx.fillRect(x-15,y-25,30,20);ctx.fillStyle='#d7ad89';ctx.fillRect(x+m.dir*10-5,y-22,10,9)}ctx.fillStyle='#3d1414';ctx.fillRect(x-14,y-46,28,4);ctx.fillStyle='#5bd15e';ctx.fillRect(x-14,y-46,28*clamp(m.hp/55,0,1),4)});
// player
let px=P.x-cam.x,py=P.y-cam.y;ctx.save();if(P.hurt>0&&Math.floor(P.hurt*12)%2)ctx.globalAlpha=.35;ctx.translate(px,py);ctx.scale(P.facing,1);ctx.fillStyle='#315d82';ctx.fillRect(-10,-25,20,25);ctx.fillStyle='#d9a978';ctx.fillRect(-10,-47,20,22);ctx.fillStyle='#34251b';ctx.fillRect(-11,-49,22,7);ctx.fillStyle='#fff';ctx.fillRect(3,-40,4,4);ctx.fillStyle='#283a66';ctx.fillRect(-10,0,8,9);ctx.fillRect(3,0,8,9);if(P.attack>0){ctx.strokeStyle='#eee';ctx.lineWidth=4;ctx.beginPath();ctx.arc(8,-24,27,-1.3,.7);ctx.stroke()}ctx.restore();
if(P._mine){let q=P._mine,x=q.x*TILE-cam.x,y=q.y*TILE-cam.y;ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(x+3,y+3,26,26);ctx.fillStyle='#fff5';ctx.fillRect(x,y,32*(q.v/(BLOCK[block(q.x,q.y)].hard||1)),3)}particles.forEach(p=>{ctx.globalAlpha=p.a;ctx.fillStyle=p.col;ctx.fillRect(p.x-cam.x,p.y-cam.y,5,5)});ctx.globalAlpha=1;
if(weather==='rain'){ctx.strokeStyle='#b8ddf099';ctx.lineWidth=1;for(let i=0;i<55;i++){let x=(i*97+performance.now()*.25)%W,y=(i*53+performance.now()*.5)%H;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-6,y+16);ctx.stroke()}}
ctx.fillStyle=`rgba(10,18,39,${night*.52})`;ctx.fillRect(0,0,W,H)}
function updateHUD(){document.querySelector('#hpBar').style.width=P.hp+'%';document.querySelector('#hpText').textContent=`❤ ${Math.ceil(P.hp)}/100`;document.querySelector('#foodBar').style.width=P.food+'%';document.querySelector('#foodText').textContent=`🍖 ${Math.ceil(P.food)}/100`;let req=P.level*40;if(P.xp>=req){P.xp-=req;P.level++;toast(`升级！当前等级 ${P.level}`)}document.querySelector('#xpBar').style.width=P.xp/req*100+'%';document.querySelector('#xpText').textContent=`Lv.${P.level}  ${P.xp}/${req}`;let phase=time<.18?'深夜':time<.32?'清晨':time<.68?'白昼':time<.82?'黄昏':'夜晚';document.querySelector('#dayLabel').textContent=`第 ${day} 天 · ${phase}${weather==='rain'?' · 雨':''}`}
function renderHotbar(){let el=document.querySelector('#hotbar');el.innerHTML=P.hot.map((id,i)=>`<button class="slot ${i===selected?'sel':''}" data-slot="${i}"><em>${i+1}</em>${ITEMS[id]||'·'}<small>${itemCount(id)||''}</small>${P.tools[id]?`<span class="dur"><i style="width:${P.tools[id]}%"></i></span>`:''}</button>`).join('');el.querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=+b.dataset.slot;renderHotbar()})}
const recipes=[{name:'木板 ×4',out:'plank',n:4,in:{wood:1}},{name:'火把 ×4',out:'torch',n:4,in:{wood:1,coal:1}},{name:'木镐',out:'pick',n:1,in:{plank:3,wood:2},tool:70},{name:'木斧',out:'axe',n:1,in:{plank:3,wood:2},tool:70},{name:'石剑',out:'sword',n:1,in:{stone:2,wood:1},tool:90}];
function canCraft(r){return Object.entries(r.in).every(([k,n])=>itemCount(k)>=n)}function craft(r){if(!canCraft(r))return;Object.entries(r.in).forEach(([k,n])=>use(k,n));P.inv[r.out]=(P.inv[r.out]||0)+r.n;if(r.tool){P.tools[r.out]=r.tool;if(!P.hot.includes(r.out))P.hot[0]=r.out}toast(`合成成功：${r.name}`);checkQuest();showTab('craft');renderHotbar()}
function showTab(tab){let body=document.querySelector('#tabBody');if(tab==='items'){let ids=Object.keys(P.inv);body.innerHTML=`<div class="grid">${ids.map(id=>`<div class="invslot" title="${BLOCK[id]?.n||id}">${ITEMS[id]||'◆'}<small>${P.inv[id]}</small></div>`).join('')}</div>`}else if(tab==='craft'){body.innerHTML=`<div class="craft-list">${recipes.map((r,i)=>`<div class="recipe"><div><b>${ITEMS[r.out]} ${r.name}</b><br><small>${Object.entries(r.in).map(([k,n])=>`${ITEMS[k]}×${n}`).join(' + ')}</small></div><button class="pixel" data-recipe="${i}" ${canCraft(r)?'':'disabled'}>制作</button></div>`).join('')}</div>`;body.querySelectorAll('[data-recipe]').forEach(b=>b.onclick=()=>craft(recipes[+b.dataset.recipe]))}else body.innerHTML=`<div class="stats"><div class="stat">生存天数<br><b>${day}</b></div><div class="stat">等级<br><b>${P.level}</b></div><div class="stat">挖掘方块<br><b>${P.mined}</b></div><div class="stat">放置方块<br><b>${P.placed}</b></div><div class="stat">击败生物<br><b>${P.kills}</b></div><div class="stat">世界坐标<br><b>${Math.floor(P.x/TILE)}, ${Math.floor(P.y/TILE)}</b></div></div>`}
let toastTimer;function toast(s){let e=document.querySelector('#toast');e.textContent=s;e.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('on'),1500)}
function save(){try{localStorage.setItem('blockbound-save',JSON.stringify({world,P,time,day,weather,questIndex}));toast('世界已保存')}catch(e){toast('存储空间不足，保存失败')}}function load(){try{let s=JSON.parse(localStorage.getItem('blockbound-save'));if(!s)return false;world=s.world;P=s.P;time=s.time;day=s.day;weather=s.weather||'clear';questIndex=s.questIndex||0;P.tools=P.tools||{};P.hot=P.hot||['pick','dirt','wood','plank','torch','apple'];spawnClouds();return true}catch(e){return false}}
const input={x:0,mine:false};let joyId=null,joyCenter={};function joyMove(e){let t=[...e.touches].find(x=>x.identifier===joyId);if(!t)return;let dx=t.clientX-joyCenter.x,dy=t.clientY-joyCenter.y,d=Math.hypot(dx,dy),m=Math.min(36,d),nx=d?dx/d:0,ny=d?dy/d:0;document.querySelector('#stick').style.transform=`translate(${nx*m}px,${ny*m}px)`;input.x=Math.abs(dx)>12?clamp(dx/36,-1,1):0}
let joy=document.querySelector('#joy');joy.addEventListener('touchstart',e=>{let t=e.changedTouches[0];joyId=t.identifier;let r=joy.getBoundingClientRect();joyCenter={x:r.left+r.width/2,y:r.top+r.height/2};joyMove(e)});joy.addEventListener('touchmove',joyMove);joy.addEventListener('touchend',()=>{joyId=null;input.x=0;document.querySelector('#stick').style.transform=''})
document.querySelectorAll('[data-act]').forEach(b=>{let act=b.dataset.act;let down=e=>{e.preventDefault();if(act==='jump'&&P.on){P.vy=-8.2;P.on=false}else if(act==='mine')input.mine=true;else if(act==='place'){if(P.hot[selected]==='apple')eat();else place()}else attack()};b.addEventListener('touchstart',down);b.addEventListener('mousedown',down);if(act==='mine'){let up=()=>input.mine=false;b.addEventListener('touchend',up);b.addEventListener('mouseup',up);b.addEventListener('mouseleave',up)}});
addEventListener('keydown',e=>{if(e.key==='a'||e.key==='ArrowLeft')input.x=-1;if(e.key==='d'||e.key==='ArrowRight')input.x=1;if((e.key==='w'||e.key===' ')&&P.on)P.vy=-8.2;if(e.key==='e')openInv();if(e.key==='f')attack();if(e.key==='q')place();if(/[1-6]/.test(e.key)){selected=+e.key-1;renderHotbar()}});addEventListener('keyup',e=>{if(['a','d','ArrowLeft','ArrowRight'].includes(e.key))input.x=0});
function openInv(){paused=true;document.querySelector('#inventory').classList.add('on');showTab('items')}document.querySelector('#invBtn').onclick=openInv;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{b.closest('.panel').classList.remove('on');paused=false});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('on'));b.classList.add('on');showTab(b.dataset.tab)});
document.querySelector('#pauseBtn').onclick=()=>{paused=true;document.querySelector('#pause').classList.add('on')};document.querySelector('#resume').onclick=()=>{paused=false;document.querySelector('#pause').classList.remove('on')};document.querySelector('#save').onclick=save;document.querySelector('#newWorld').onclick=()=>{if(confirm('确定舍弃当前世界并重新生成吗？')){gen();save();paused=false;document.querySelector('#pause').classList.remove('on');boot()}};
function boot(){running=true;paused=false;document.querySelector('#start').classList.remove('on');document.querySelector('#death').classList.remove('on');renderHotbar();updateQuest();updateHUD()}
document.querySelector('#continue').onclick=()=>{if(!load()){gen();toast('没有旧存档，已创建新世界')}boot()};document.querySelector('#startNew').onclick=()=>{gen();save();boot()};document.querySelector('#respawn').onclick=()=>{P.hp=100;P.food=75;P.x=WORLD_W*TILE/2;P.y=8*TILE;Object.keys(P.inv).forEach(k=>P.inv[k]=Math.ceil(P.inv[k]*.8));boot()};
function loop(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);render();requestAnimationFrame(loop)}gen();document.querySelector('#continue').style.display=localStorage.getItem('blockbound-save')?'block':'none';requestAnimationFrame(loop);
})();
</script></body></html>
