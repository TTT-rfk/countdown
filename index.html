<style>

/* === CAPSULE: days-centered design === */
.capsule{position:fixed;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:18px 16px 14px;border-radius:55px;cursor:pointer;border:1.5px solid rgba(255,255,255,.08);background:rgba(8,8,28,.75);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);min-width:150px;max-width:240px;z-index:10;will-change:left,top;user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:border-color .8s,box-shadow .8s}

.capsule-detail .big-num{font-size:clamp(5rem,16vw,10rem);font-weight:900;line-height:1;margin-bottom:4px}
.capsule-detail .big-label{font-size:.9rem;color:rgba(255,255,255,.35);margin-bottom:18px;letter-spacing:3px}
.capsule-detail .cap-title{font-size:1.1rem;font-weight:600;margin-bottom:4px}
.capsule-detail .cap-date{font-size:.78rem;color:rgba(255,255,255,.25);margin-bottom:28px}
.capsule-detail .share-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 32px;border-radius:24px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:rgba(255,255,255,.55);font-size:.9rem;cursor:pointer;letter-spacing:1px}

.empty-hint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:rgba(255,255,255,.1);z-index:5;pointer-events:none}

</style></head><body>
<canvas id="bgCanvas"></canvas>
<div class="empty-hint" id="emptyHint"><div class="icon">🛸</div><p>空空如也<br>点右下角 + 封存</p></div>
<div class="capsule-detail hidden" id="detailView">
<button class="back-btn" id="backBtn">←</button>
<div class="big-num" id="bigNum"></div><div class="big-label" id="bigLabel"></div>

<button class="fab" id="fabBtn">+</button><div class="gravity-hint" id="gravityHint">📱 倾斜手机感受重力漂浮</div>
<div class="modal-overlay hidden" id="modalOverlay"><div class="modal">
<h2 id="modalTitle">封存一枚时间胶囊</h2>
<div class="field"><label>胶囊名称</label><input type="text" id="inputTitle" placeholder="例：高考倒计时" maxlength="30"></div>
<div class="field"><label>日期</label><input type="date" id="inputDate"></div>
<div class="field"><label>类型</label><select id="inputType"><option value="countdown">倒计时（未来）</option><option value="anniversary">纪念日（已过）</option></select></div>
<div class="field"><label>颜色</label><select id="inputColor"><option value="purple">紫色</option><option value="blue">蓝色</option><option value="pink">粉色</option><option value="orange">橙色</option><option value="green">绿色</option><option value="red">红色</option></select></div>

<script>

function L(){try{return JSON.parse(localStorage.getItem("cd")||"[]")}catch(e){return[]}}

function fd(d){var y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");return y+"."+m+"."+day}

var P={vMax:2, damp:0.998, gravK:0.03, bounceK:0.5, e:0.25, collDamp:0.85};

function spawnPos(r,skipIdx){
  for(var t=0;t<60;t++){
    var x=r+10+Math.random()*(cW-2*r-20), y=r+10+Math.random()*(cH-2*r-100);
    var ok=true;
    for(var i=0;i<capsules.length;i++){
      if(i===skipIdx)continue;
      var ci=capsules[i], dx=x-ci.x, dy=y-ci.y;
      if(Math.sqrt(dx*dx+dy*dy)<r+ci.r+35){ok=false;break}
    }

  }

}

function createCapsule(item,idx){

  var d=new Date(item.date);d.setHours(0,0,0,0);
  var n=new Date();n.setHours(0,0,0,0);

  var lb=ip?"天前":"天后";if(days===0){lb="今天";ad="今";}

  el.querySelector(".del-btn").addEventListener("click",function(e){e.stopPropagation();di(idx)});

  el.style.left=(cap.x-r)+"px";el.style.top=(cap.y-r)+"px";
  capsules.push(cap);return cap;
}
function eh(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}

function updatePhysics(){
  for(var i=0;i<capsules.length;i++){
    var ci=capsules[i];
    ci.vx+=gx*P.gravK;ci.vy+=gy*P.gravK;
    ci.vx*=P.damp;ci.vy*=P.damp;
    var sp=Math.sqrt(ci.vx*ci.vx+ci.vy*ci.vy);
    if(sp>P.vMax){ci.vx=ci.vx/sp*P.vMax;ci.vy=ci.vy/sp*P.vMax}
    ci.x+=ci.vx;ci.y+=ci.vy;
    var pad=ci.r+8;
    if(ci.x<pad){ci.x=pad;ci.vx=Math.abs(ci.vx)*P.bounceK}
    if(ci.x>cW-pad){ci.x=cW-pad;ci.vx=-Math.abs(ci.vx)*P.bounceK}
    if(ci.y<pad){ci.y=pad;ci.vy=Math.abs(ci.vy)*P.bounceK}
    if(ci.y>cH-pad-80){ci.y=cH-pad-80;ci.vy=-Math.abs(ci.vy)*P.bounceK}
  }
  for(var i=0;i<capsules.length;i++){
    for(var j=i+1;j<capsules.length;j++){
      var a=capsules[i],b=capsules[j],dx=b.x-a.x,dy=b.y-a.y,dist=Math.sqrt(dx*dx+dy*dy),minDist=a.r+b.r;
      if(dist<minDist&&dist>0.01){
        var nx=dx/dist,ny=dy/dist,overlap=minDist-dist;
        a.x-=nx*overlap*0.5;a.y-=ny*overlap*0.5;
        b.x+=nx*overlap*0.5;b.y+=ny*overlap*0.5;
        var dvx=b.vx-a.vx,dvy=b.vy-a.vy,vn=dvx*nx+dvy*ny;
        if(vn<0){
          var jj=-(1+P.e)*vn/(a.mass+b.mass);
          a.vx-=jj*b.mass*nx;a.vy-=jj*b.mass*ny;
          b.vx+=jj*a.mass*nx;b.vy+=jj*a.mass*ny;
          a.vx*=P.collDamp;a.vy*=P.collDamp;
          b.vx*=P.collDamp;b.vy*=P.collDamp;
        }
      }
    }
  }
  for(var i=0;i<capsules.length;i++){
    var c=capsules[i];
    c.el.style.left=(c.x-c.r)+"px";c.el.style.top=(c.y-c.r)+"px";
  }
}

function renderLoop(){
  _raf=requestAnimationFrame(renderLoop);updatePhysics();
  if(bc){bc.clearRect(0,0,bW,bH);
  for(var k=0;k<bps.length;k++){var bp=bps[k];bp.p+=bp.s;
    var bal=0.12+0.12*Math.sin(bp.p);bc.beginPath();bc.arc(bp.x,bp.y,bp.r,0,Math.PI*2);
    bc.fillStyle="rgba(255,255,255,"+bal+")";bc.fill()}}
}

/* ====== UI ====== */
function rebuildAll(){
  while(capsules.length>0){var c=capsules.pop();if(c.el.parentNode)c.el.remove();}
  var items=L();E("emptyHint").style.display=items.length===0?"block":"none";
  for(var i=0;i<items.length;i++)createCapsule(items[i],i);
  updateDetailIfOpen();
}
var detailOpenIdx=-1;
function openDetail(idx){
  detailOpenIdx=idx;
  var items=L(),item=items[idx];if(!item)return;
  var co=COLORS[item.color]||COLORS.purple;
  var d=new Date(item.date);d.setHours(0,0,0,0);
  var n=new Date();n.setHours(0,0,0,0);
  var days=db(n,d),ip=days<0,ad=Math.abs(days);
  var lb=ip?"天前":"天后";if(days===0){lb="今天";ad="今";}
  E("capTitle").textContent=item.title;E("capTitle").style.color=co.hex;
  E("capDate").textContent=fd(d);
  E("bigNum").textContent=ad;E("bigNum").style.color=co.hex;
  E("bigNum").style.textShadow="0 0 50px "+co.hex+",0 0 120px "+co.hex+"60,0 0 200px "+co.hex+"30";
  E("bigLabel").textContent=lb;
  E("detailView").classList.remove("hidden");
  for(var i=0;i<capsules.length;i++){capsules[i].vx*=0.25;capsules[i].vy*=0.25}
}
function updateDetailIfOpen(){
  if(detailOpenIdx<0)return;var items=L();
  if(detailOpenIdx>=items.length){closeDetail();return}openDetail(detailOpenIdx);
}
function closeDetail(){
  detailOpenIdx=-1;
  for(var i=0;i<capsules.length;i++){capsules[i].vx/=0.25;capsules[i].vy/=0.25}
  E("detailView").classList.add("hidden");
}
function sm(ei){
  E("modalOverlay").classList.remove("hidden");
  E("inputTitle").value="";E("inputType").value="countdown";E("inputColor").value="purple";
  E("modalTitle").textContent=ei!==undefined?"编辑胶囊":"封存一枚时间胶囊";
  var t=new Date();t.setHours(0,0,0,0);E("inputDate").value=t.toISOString().split("T")[0];
  if(ei!==undefined){var items=L(),item=items[ei];E("inputTitle").value=item.title;E("inputDate").value=item.date;E("inputType").value=item.type;E("inputColor").value=item.color;E("modalTitle").textContent="编辑胶囊";window._editIdx=ei;}
  E("inputTitle").focus();
}
function hm(){E("modalOverlay").classList.add("hidden")}
function sv(){
  var t=E("inputTitle").value.trim(),d=E("inputDate").value;
  if(!t){st("请输入名称");return}if(!d){st("请选择日期");return}
  var items=L();
  if(window._editIdx!==undefined){items[window._editIdx]={title:t,date:d,type:E("inputType").value,color:E("inputColor").value,createdAt:items[window._editIdx].createdAt};delete window._editIdx;S(items);hm();rebuildAll();st("胶囊已更新");return}
  items.push({title:t,date:d,type:E("inputType").value,color:E("inputColor").value,createdAt:new Date().toISOString()});S(items);hm();rebuildAll();st("胶囊已封存");
}
function di(idx){var items=L(),nm=items[idx].title;items.splice(idx,1);S(items);if(detailOpenIdx===idx)closeDetail();rebuildAll();st("已销毁：「"+nm+"」");}
function st(msg){var t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove()},2200);}
function burst(ch,n){for(var i=0;i<(n||20);i++){var p=document.createElement("div");p.className="burst-particle";var a=Math.random()*Math.PI*2,d=60+Math.random()*140;p.style.cssText="left:50%;top:50%;width:8px;height:8px;border-radius:50%;background:"+ch+";--bx:"+Math.cos(a)*d+"px;--by:"+Math.sin(a)*d+"px";document.body.appendChild(p);setTimeout(function(){p.remove()},2200)}}

/* ====== GRAVITY ====== */
function sg(){if(window.DeviceOrientationEvent){if(typeof DeviceOrientationEvent.requestPermission==="function"){DeviceOrientationEvent.requestPermission().then(function(s){if(s==="granted")lo()}).catch(function(){});}else lo();}}
function lo(){
  var _tgx=0,_tgy=0.05;
  window.addEventListener("deviceorientation",function(e){
    _tgx=-(e.gamma||0)/85;_tgy=((e.beta||0)-60)/130+0.05;
    gx+=(_tgx-gx)*0.05;gy+=(_tgy-gy)*0.05;gravActive=true;
    var h=E("gravityHint");if(h){h.style.opacity="0";setTimeout(function(){h.remove()},1000)}
  });
  E("gravityHint").textContent="📱 重力感应已激活";
  setTimeout(function(){var h=E("gravityHint");if(h)h.style.opacity="0"},2000);
}

/* ====== BG STARS ====== */
var bc,bW,bH,bps=[];
(function(){var c=E("bgCanvas");bc=c.getContext("2d");function rs(){bW=c.width=Math.ceil(innerWidth*1.2);bH=c.height=Math.ceil(innerHeight*1.2)}rs();addEventListener("resize",function(){rs();cW=innerWidth;cH=innerHeight});for(var i=0;i<70;i++)bps.push({x:Math.random()*bW,y:Math.random()*bH,r:0.3+Math.random()*1.5,p:Math.random()*Math.PI*2,s:0.001+Math.random()*0.006});})();

/* ====== EVENTS ====== */
E("fabBtn").addEventListener("click",function(){sm()});E("btnCancel").addEventListener("click",hm);E("btnSave").addEventListener("click",sv);E("modalOverlay").addEventListener("click",function(e){if(e.target===this)hm()});E("backBtn").addEventListener("click",closeDetail);
E("shareBtn").addEventListener("click",function(){if(detailOpenIdx<0)return;var item=L()[detailOpenIdx];if(!item)return;var url=su(item);if(navigator.share)navigator.share({title:item.title,url:url}).catch(function(){});navigator.clipboard.writeText(url).then(function(){st("链接已复制！发送给朋友即可")});});
E("detailView").addEventListener("click",function(e){if(e.target===this&&!e.target.closest("button")){burst(COLORS[L()[detailOpenIdx]?.color]?.hex||"#a78bfa",25)}});addEventListener("resize",function(){cW=innerWidth;cH=innerHeight});

/* ====== INIT ====== */
sg();rebuildAll();_raf=requestAnimationFrame(renderLoop);
(function init(){var h=location.hash.slice(1);if(h){try{var item=JSON.parse(decodeURIComponent(escape(atob(h))));if(item&&item.title&&item.date){var items=L(),found=-1;for(var i=0;i<items.length;i++){if(items[i].title===item.title&&items[i].date===item.date){found=i;break}}if(found<0){items.push(item);S(items);rebuildAll();found=items.length-1}openDetail(found);return;}}catch(e){}}})();
setInterval(function(){if(detailOpenIdx>=0)updateDetailIfOpen();var items=L();for(var i=0;i<capsules.length;i++){var cap=capsules[i];if(cap.idx>=items.length)continue;var item=items[cap.idx],co=COLORS[item.color]||COLORS.purple;var d=new Date(item.date);d.setHours(0,0,0,0);var n=new Date();n.setHours(0,0,0,0);var days=db(n,d),ip=days<0,ad=Math.abs(days);var lb=ip?"天前":"天后";if(days===0){lb="今天";ad="今";}cap.el.querySelector(".cap-days").textContent=ad;cap.el.querySelector(".cap-label").textContent=lb;cap.el.querySelector(".cap-days").style.color=co.hex;}},60000);
</script></body></html>]]>
