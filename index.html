<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试页面 - Operit 部署</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .card {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        h1 { font-size: 2em; margin-bottom: 15px; }
        p { font-size: 1.1em; opacity: 0.9; line-height: 1.6; }
        .status { margin-top: 20px; padding: 10px 20px; background: rgba(255,255,255,0.2); border-radius: 10px; display: inline-block; }
        .time { margin-top: 15px; font-size: 0.9em; opacity: 0.7; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 Operit 部署测试</h1>
        <p>这是一个通过 Operit AI 助手创建并部署到 GitHub Pages 的静态页面。</p>
        <div class="status">✅ 部署成功</div>
        <div class="time" id="time"></div>
    </div>
    <script>
        document.getElementById('time').textContent = '部署时间: ' + new Date().toLocaleString('zh-CN');
    </script>
</body>
</html>
