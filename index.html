<!DOCTYPE html><html lang="zh-CN"><head>

<style>
*{margin:0;padding:0;box-sizing:border-box}

.card{border-radius:50px;padding:22px 26px;display:flex;align-items:center;gap:16px;cursor:pointer;position:relative;overflow:hidden;will-change:transform;border:1.5px solid rgba(255,255,255,.06);background:rgba(255,255,255,.025);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:border-color .6s,box-shadow .6s;min-height:88px}
