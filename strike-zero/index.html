<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#111b20">
<title>STRIKE ZERO · 灰港行动</title>
<style>
:root{--ice:#dce8e7;--blue:#72bfd4;--amber:#ffb33f;--red:#ff554a;--ink:#091014;--glass:rgba(10,22,27,.72)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071015;color:var(--ice);font-family:"Arial Narrow","DIN Condensed",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}button{font:inherit;color:inherit}canvas{position:fixed;inset:0;width:100%;height:100%}
#grain{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:.12;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(210,240,240,.08) 4px)}
#hud{position:fixed;inset:0;z-index:5;pointer-events:none;text-shadow:0 1px 3px #000}
.corner{position:absolute;width:70px;height:70px;border-color:rgba(155,211,220,.38);border-style:solid}.tl{left:12px;top:12px;border-width:2px 0 0 2px}.tr{right:12px;top:12px;border-width:2px 2px 0 0}.bl{left:12px;bottom:12px;border-width:0 0 2px 2px}.br{right:12px;bottom:12px;border-width:0 2px 2px 0}
#mission{position:absolute;left:max(18px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));padding:8px 12px;border-left:3px solid var(--amber);background:linear-gradient(90deg,rgba(7,15,18,.78),transparent);min-width:210px}.eyebrow{font-size:9px;letter-spacing:2px;color:#8aa4a8}.big{font-size:18px;font-weight:800;letter-spacing:1px}.small{font:10px monospace;color:#abc0c2;margin-top:3px}
#topStats{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:3px}.chip{min-width:72px;padding:5px 10px;background:var(--glass);border-top:2px solid #50737b;text-align:center;font:10px monospace}.chip b{display:block;font:700 15px "Arial Narrow";color:#fff}
#killfeed{position:absolute;right:max(18px,env(safe-area-inset-right));top:55px;text-align:right;font:10px monospace}.kill{margin:3px 0;padding:4px 7px;background:linear-gradient(270deg,rgba(8,16,18,.8),transparent);animation:killout 3.2s forwards}@keyframes killout{0%,70%{opacity:1;transform:none}100%{opacity:0;transform:translateX(20px)}}
#vitals{position:absolute;left:max(22px,env(safe-area-inset-left));bottom:max(20px,env(safe-area-inset-bottom));width:220px}.vrow{display:grid;grid-template-columns:34px 1fr 32px;gap:6px;align-items:center;font:10px monospace;margin-top:5px}.bar{height:7px;background:#13252a;transform:skewX(-15deg);overflow:hidden}.fill{height:100%;transition:width .12s}.hp{background:linear-gradient(90deg,#b73935,#ff6b55)}.armor{background:linear-gradient(90deg,#286e83,#72bfd4)}.stamina{background:linear-gradient(90deg,#9b7428,#ffca58)}
#weaponPanel{position:absolute;right:max(22px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));text-align:right}.weaponName{font-size:13px;letter-spacing:2px;color:var(--amber)}.ammo{font:800 38px "Arial Narrow";line-height:.9}.ammo span{font:14px monospace;color:#91a4a6}.mode{font:9px monospace;color:#8fb8c1;margin-top:4px}
#crosshair{position:absolute;left:50%;top:50%;width:44px;height:44px;transform:translate(-50%,-50%);transition:.08s}#crosshair i{position:absolute;background:#e9ffff;box-shadow:0 0 4px #62cde4}#crosshair i:nth-child(1){width:9px;height:1px;left:3px;top:21px}#crosshair i:nth-child(2){width:9px;height:1px;right:3px;top:21px}#crosshair i:nth-child(3){height:9px;width:1px;left:21px;top:3px}#crosshair i:nth-child(4){height:9px;width:1px;left:21px;bottom:3px}#hitmarker{position:absolute;inset:12px;border:1px solid transparent;transform:rotate(45deg)}#hitmarker.on{border-color:#fff;animation:hm .12s}@keyframes hm{from{transform:rotate(45deg) scale(1.5)}to{transform:rotate(45deg)}}
#damageDir{position:absolute;left:50%;top:20%;width:80px;height:16px;transform:translateX(-50%);opacity:0;background:linear-gradient(90deg,transparent,var(--red),transparent);clip-path:polygon(50% 0,100% 100%,50% 55%,0 100%)}
#radarWrap{position:absolute;right:max(22px,env(safe-area-inset-right));top:82px;width:104px;height:104px;border:1px solid rgba(113,188,205,.4);border-radius:50%;background:rgba(3,12,15,.52);overflow:hidden}#radar{position:absolute;width:100%;height:100%}#radarSweep{position:absolute;inset:50% 0 0 50%;transform-origin:0 0;background:linear-gradient(25deg,rgba(95,211,230,.28),transparent 60%);animation:sweep 3s linear infinite}@keyframes sweep{to{transform:rotate(360deg)}}
#notice{position:absolute;left:50%;top:29%;transform:translate(-50%,-50%);text-align:center;opacity:0}.noticeMain{font-size:25px;font-weight:900;letter-spacing:4px}.noticeSub{font:10px monospace;color:var(--amber)}
#boss{position:absolute;top:64px;left:50%;transform:translateX(-50%);width:min(420px,48vw);display:none;text-align:center}.bossbar{height:7px;border:1px solid #9d554d;background:#26100e}.bossfill{height:100%;background:linear-gradient(90deg,#8e241f,#ff735c)}
#controls{position:fixed;inset:0;z-index:8;pointer-events:none}.btn{pointer-events:auto;position:absolute;border:1px solid rgba(177,224,230,.24);background:rgba(17,38,43,.36);backdrop-filter:blur(3px);border-radius:50%;display:grid;place-items:center;color:#dce8e7;font-weight:800}.btn:active{background:rgba(255,179,63,.26);border-color:var(--amber)}#stick{left:max(22px,env(safe-area-inset-left));bottom:max(24px,env(safe-area-inset-bottom));width:116px;height:116px}#knob{width:48px;height:48px;border:1px solid #7eb3bc;border-radius:50%;background:rgba(87,149,160,.22)}#fire{right:max(28px,env(safe-area-inset-right));bottom:max(44px,env(safe-area-inset-bottom));width:82px;height:82px;font-size:12px}#ads{right:126px;bottom:104px;width:54px;height:54px;font-size:10px}#reload{right:122px;bottom:32px;width:54px;height:54px;font-size:10px}#swap{right:48px;bottom:137px;width:46px;height:46px;font-size:9px}#sprint{left:148px;bottom:45px;width:50px;height:50px;font-size:9px}
#menu{position:fixed;inset:0;z-index:20;display:flex;align-items:center;background:radial-gradient(circle at 70% 40%,rgba(47,92,99,.24),transparent 32%),linear-gradient(110deg,#071014 0 46%,rgba(7,16,20,.72));padding:7vw}.menuBox{max-width:530px;border-left:4px solid var(--amber);padding-left:24px}.kicker{font:10px monospace;letter-spacing:5px;color:var(--amber)}h1{font-size:clamp(42px,8vw,86px);line-height:.78;letter-spacing:-3px;margin:14px 0 20px}h1 span{display:block;color:#759097;font-size:.46em;letter-spacing:8px;margin-top:14px}.desc{max-width:450px;color:#a6b6b8;font-size:12px;line-height:1.7}.start{margin-top:22px;padding:13px 32px;border:0;background:var(--amber);color:#15130d;font-weight:900;letter-spacing:3px;clip-path:polygon(0 0,93% 0,100% 30%,100% 100%,7% 100%,0 70%);cursor:pointer}.loadout{display:flex;gap:6px;margin-top:18px}.loadout span{font:9px monospace;border:1px solid #3c5c63;padding:6px 9px;color:#91a8ac}.orient{display:none}
@media(orientation:portrait){.orient{display:grid;position:fixed;inset:0;z-index:50;background:#071014;place-items:center;text-align:center;font:14px monospace}.orient b{display:block;font-size:42px;margin-bottom:15px}}@media(pointer:fine){#controls{opacity:.28}#stick{display:none}}
</style></head>
<body>
<canvas id="game"></canvas><div id="grain"></div>
<div id="hud"><div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
<div id="mission"><div class="eyebrow">OPERATION / ACTIVE</div><div class="big" id="objective">守住灰港中继站</div><div class="small" id="progress">威胁波次 01 · 目标 0/8</div></div>
<div id="topStats"><div class="chip">SCORE<b id="score">000000</b></div><div class="chip">WAVE<b id="wave">01</b></div><div class="chip">COMBO<b id="combo">x1.0</b></div></div><div id="killfeed"></div>
<div id="boss"><div class="eyebrow" id="bossName">重装执行者</div><div class="bossbar"><div class="bossfill" id="bossFill"></div></div></div>
<div id="vitals"><div class="vrow"><b>HP</b><div class="bar"><div id="hp" class="fill hp"></div></div><span id="hpN">100</span></div><div class="vrow"><b>ARM</b><div class="bar"><div id="armor" class="fill armor"></div></div><span id="armorN">75</span></div><div class="vrow"><b>RUN</b><div class="bar"><div id="stamina" class="fill stamina"></div></div><span></span></div></div>
<div id="weaponPanel"><div class="weaponName" id="weaponName">VX-7 CARBINE</div><div class="ammo"><b id="mag">30</b><span> / <b id="reserve">180</b></span></div><div class="mode" id="mode">AUTO · 5.56 AP</div></div>
<div id="crosshair"><i></i><i></i><i></i><i></i><div id="hitmarker"></div></div><div id="damageDir"></div><div id="notice"><div class="noticeMain"></div><div class="noticeSub"></div></div><div id="radarWrap"><canvas id="radar" width="104" height="104"></canvas><div id="radarSweep"></div></div></div>
<div id="controls"><div id="stick" class="btn"><div id="knob"></div></div><button id="fire" class="btn">FIRE</button><button id="ads" class="btn">ADS</button><button id="reload" class="btn">RLD</button><button id="swap" class="btn">SWAP</button><button id="sprint" class="btn">RUN</button></div>
<div id="menu"><div class="menuBox"><div class="kicker">TACTICAL MOBILE FPS</div><h1>STRIKE<br>ZERO<span>灰港行动</span></h1><div class="desc">风暴封锁了撤离航线。守住中继站，在雾、火焰与重装部队中生存。建议横屏并佩戴耳机。</div><div class="loadout"><span>4 类枪械</span><span>动态战场</span><span>精英波次</span><span>战术补给</span></div><button class="start" id="start">进入战区</button></div></div><div class="orient"><div><b>↻</b>请旋转至横屏进入战区</div></div>
<script src="core.js"></script><script src="game.js"></script></body></html>
